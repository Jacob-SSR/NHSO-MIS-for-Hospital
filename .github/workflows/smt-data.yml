name: อัปเดตข้อมูลเงินโอน SMT (แดชบอร์ด)

# Refreshes public/dashboards/smt/data.json from SMT once a day (07:10 Bangkok time) and on demand.

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smt-data
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  refresh:
    # set repository variable RUNNER=self-hosted to run on a machine inside the hospital (Thai IP)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-smt-data.mjs
      - name: Commit data
        run: |
          git add public/dashboards/smt/data.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "planfin-bot"
          git config user.email "planfin-bot@users.noreply.github.com"
          git commit -m "data: refresh SMT transfers"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i*5)); done
          exit 1
